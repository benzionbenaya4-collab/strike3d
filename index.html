<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strike3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#0b0d12; --panel:#151922cc; --fg:#eef2f8; --muted:#8b95a7; --acc:#ffb020; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Rubik, sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .menu { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:16px;
          background:radial-gradient(ellipse at 50% 30%, #1c2333 0%, #0b0d12 70%); }
  .menu h1 { font-size:clamp(40px,11vw,84px); font-weight:900; margin:0 0 8px; letter-spacing:2px;
             background:linear-gradient(180deg,#fff,#ffb020); -webkit-background-clip:text; color:transparent; direction:ltr; }
  .btn { width:min(340px,100%); padding:14px 18px; border-radius:14px; border:1px solid #2a3142; background:var(--panel);
         color:var(--fg); font:700 18px Rubik; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .btn:hover { border-color:var(--acc); }
  .btn small { color:var(--muted); font-weight:400; font-size:13px; }
  .bar { position:absolute; top:0; inset-inline:0; display:flex; gap:8px; padding:12px; align-items:center; }
  .chip { padding:8px 12px; border-radius:999px; border:1px solid #2a3142; background:var(--panel); color:var(--fg); font:600 14px Rubik; cursor:pointer; }
  .chip { white-space:nowrap; flex:none; }
  .bar, .skins { overflow-x:auto; scrollbar-width:none; }
  .rows { position:absolute; top:0; inset-inline:0; display:flex; flex-direction:column; gap:6px; padding:10px 12px; }
  .row { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  @media (max-width:520px) { .chip { padding:7px 10px; font-size:13px; } }
  .chip.on { border-color:var(--acc); color:var(--acc); }
  .skins { position:absolute; bottom:0; inset-inline:0; display:flex; gap:8px; padding:12px 12px max(12px, env(safe-area-inset-bottom)); overflow-x:auto; }
  .info { position:absolute; top:64px; inset-inline-start:16px; background:var(--panel); padding:12px 14px; border-radius:12px; font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
